<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Header Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.06); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pingDot {
      0% { r: 3; opacity: 1; }
      75%, 100% { r: 8; opacity: 0; }
    }

    .flowing-path {
      stroke-dasharray: 6 6;
      animation: flowLine 2.5s linear infinite;
    }
    .floating-container {
      animation: floatCard 5s ease-in-out infinite;
    }
    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .ping-circle {
      animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Ambient Glow Spots -->
  <circle cx="150" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#neonGlow)" class="pulsing-orb" />
  <circle cx="950" cy="180" r="160" fill="#818cf8" opacity="0.14" filter="url(#neonGlow)" class="pulsing-orb" />
  <circle cx="600" cy="320" r="120" fill="#c084fc" opacity="0.08" filter="url(#neonGlow)" class="pulsing-orb" />

  <!-- LEFT SECTION: Headings & Value Proposition (Foreground & Fully Legible) -->
  <g transform="translate(60, 50)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" class="ping-circle" />
      <text x="28" y="18" fill="#38bdf8" class="badge-text" font-size="10.5" letter-spacing="0.08em">MLOPS &amp; FEATURE PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" fill="#f8fafc" class="title-text" font-size="38">
      AWESOME ML FEATURE STORES
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#94a3b8" class="subtitle-text" font-size="16">
      Production Machine Learning Infrastructure &amp; Real-Time Data Serving
    </text>

    <!-- Key Architecture Badges -->
    <g transform="translate(0, 140)">
      <!-- Badge 1: Point-in-Time Correctness -->
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
      <text x="12" y="18" fill="#a5b4fc" class="badge-text" font-size="11">⏱️ Point-in-Time Joins</text>

      <!-- Badge 2: Online & Offline Serving -->
      <rect x="190" y="0" width="160" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="202" y="18" fill="#7dd3fc" class="badge-text" font-size="11">⚡ &lt;10ms Online Serving</text>

      <!-- Badge 3: Skew Elimination -->
      <rect x="360" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="372" y="18" fill="#6ee7b7" class="badge-text" font-size="11">🛡️ Zero Training-Serving Skew</text>
    </g>

    <!-- Tech Ecosystem Strip -->
    <g transform="translate(0, 195)">
      <text x="0" y="16" fill="#64748b" class="badge-text" font-size="11" letter-spacing="0.05em">FEATURED ECOSYSTEM:</text>
      <text x="0" y="42" fill="#cbd5e1" class="badge-text" font-size="13">
        Feast · Tecton · Hopsworks · Databricks · Vertex AI · SageMaker · Chronon · Snowflake
      </text>
    </g>
  </g>

  <!-- RIGHT SECTION: Dynamic Feature Store Pipeline Card -->
  <g class="floating-container" transform="translate(680, 40)">
    <!-- Container Card -->
    <rect x="0" y="0" width="460" height="285" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect x="0" y="0" width="460" height="38" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="52" cy="19" r="5" fill="#10b981" opacity="0.85"/>
    <text x="75" y="23" fill="#cbd5e1" class="badge-text" font-size="11.5">FEATURE STORE SERVING TOPOLOGY</text>

    <!-- Architecture Nodes -->
    
    <!-- Left: Data Sources -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="105" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="10" y="22" fill="#38bdf8" font-size="14">🌊 Ingestion</text>
      <text x="10" y="45" fill="#f8fafc" class="badge-text" font-size="10.5">Stream &amp; Batch</text>
      <text x="10" y="65" fill="#94a3b8" class="badge-text" font-size="9">Kafka / Flink</text>
      <text x="10" y="80" fill="#64748b" class="badge-text" font-size="9">Lakehouse / S3</text>
    </g>

    <!-- Flow Line: Sources -> Core Store -->
    <path d="M 125 107 L 165 107" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-path" />

    <!-- Center: Feature Platform Core -->
    <g transform="translate(165, 52)">
      <rect x="0" y="0" width="130" height="110" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="12" y="22" fill="#a5b4fc" font-size="13">⚙️ Feature Core</text>
      <text x="12" y="44" fill="#f8fafc" class="badge-text" font-size="10.5">Registry &amp; Views</text>
      <text x="12" y="62" fill="#94a3b8" class="badge-text" font-size="9">Point-in-Time Join</text>
      <text x="12" y="78" fill="#94a3b8" class="badge-text" font-size="9">Data Drift Mon.</text>
      <text x="12" y="94" fill="#64748b" class="badge-text" font-size="8.5">Lineage / Unity</text>
    </g>

    <!-- Flow Lines to Online and Offline -->
    <path d="M 295 85 L 335 70" fill="none" stroke="#10b981" stroke-width="2" class="flowing-path" />
    <path d="M 295 130 L 335 145" fill="none" stroke="#f43f5e" stroke-width="2" class="flowing-path" />

    <!-- Right Top: Online Store -->
    <g transform="translate(335, 50)">
      <rect x="0" y="0" width="105" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="8" y="18" fill="#10b981" font-size="11">⚡ Online Store</text>
      <text x="8" y="32" fill="#f8fafc" class="badge-text" font-size="9.5">Redis / KV / Bigtable</text>
      <text x="8" y="44" fill="#6ee7b7" class="badge-text" font-size="8.5">&lt;10ms Inference</text>
    </g>

    <!-- Right Bottom: Offline Store -->
    <g transform="translate(335, 125)">
      <rect x="0" y="0" width="105" height="50" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="8" y="18" fill="#fb7185" font-size="11">📦 Offline Store</text>
      <text x="8" y="32" fill="#f8fafc" class="badge-text" font-size="9.5">Parquet / BigQuery</text>
      <text x="8" y="44" fill="#fda4af" class="badge-text" font-size="8.5">Batch Training Sets</text>
    </g>

    <!-- Bottom Serving Target Banner -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="420" height="75" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="16" y="26" fill="#38bdf8" font-size="13">🎯 Unified Consumption</text>
      <text x="16" y="46" fill="#f8fafc" class="badge-text" font-size="11">Production Serving &amp; Reproducible Model Training</text>
      <text x="16" y="64" fill="#94a3b8" class="badge-text" font-size="9.5">Guaranteed Consistency · Zero Data Leakage · Instant Feature Discovery</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="374" width="1200" height="6" fill="url(#primaryGrad)" />
</svg>