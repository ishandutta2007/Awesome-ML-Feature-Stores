<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a13"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="40%" stop-color="#818cf8"/><stop offset="80%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="neonGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.06)}}@keyframes flowLine{0%{stroke-dashoffset:80}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes pingDot{0%{r:3;opacity:1}75%{r:8;opacity:0}}.flowing-path{stroke-dasharray:6 6;animation:flowLine 2.5s linear infinite}.floating-container{animation:floatCard 5s ease-in-out infinite}.pulsing-orb{transform-origin:center;animation:pulseGlow 4s ease-in-out infinite}.ping-circle{animation:pingDot 2s cubic-bezier(0,0,.2,1) infinite}.title-text{font-weight:900;letter-spacing:-.02em}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.subtitle-text{font-weight:500;letter-spacing:.01em}.badge-text{font-weight:600}</style><rect width="1200" height="380" fill="url(#bgGrad)"/><g stroke="#334155" stroke-width=".5" opacity=".15"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="380"/><line x1="300" x2="300" y1="0" y2="380"/><line x1="450" x2="450" y1="0" y2="380"/><line x1="600" x2="600" y1="0" y2="380"/><line x1="750" x2="750" y1="0" y2="380"/><line x1="900" x2="900" y1="0" y2="380"/><line x1="1050" x2="1050" y1="0" y2="380"/></g><circle cx="150" cy="90" r="140" fill="#38bdf8" class="pulsing-orb" filter="url(#neonGlow)" opacity=".12"/><circle cx="950" cy="180" r="160" fill="#818cf8" class="pulsing-orb" filter="url(#neonGlow)" opacity=".14"/><circle cx="600" cy="320" r="120" fill="#c084fc" class="pulsing-orb" filter="url(#neonGlow)" opacity=".08"/><g><g transform="translate(60, 50) translate(0, 0)"><rect width="220" height="28" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="4" fill="#38bdf8"/><circle cx="16" cy="14" r="4" fill="#38bdf8" class="ping-circle"/><text x="28" y="18" fill="#38bdf8" class="badge-text" font-size="10.5" letter-spacing=".08em">MLOPS &amp; FEATURE PLATFORMS</text></g><text x="0" y="75" fill="#f8fafc" class="title-text" font-size="38" transform="translate(60, 50)">AWESOME ML FEATURE STORES</text><text x="0" y="112" fill="#94a3b8" class="subtitle-text" font-size="16" transform="translate(60, 50)">Production Machine Learning Infrastructure &amp; Real-Time Data Serving</text><g transform="translate(60, 50) translate(0, 140)"><rect width="180" height="28" x="0" y="0" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" rx="6"/><text x="12" y="18" fill="#a5b4fc" class="badge-text" font-size="11">⏱️ Point-in-Time Joins</text><rect width="160" height="28" x="190" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="6"/><text x="202" y="18" fill="#7dd3fc" class="badge-text" font-size="11">⚡ &lt;10ms Online Serving</text><rect width="165" height="28" x="360" y="0" fill="#1e293b" stroke="#10b981" stroke-width="1.2" rx="6"/><text